
services:

  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    volumes:
      - ./gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - FIREWALL_OUTBOUND_SUBNETS=${FIREWALL_OUTBOUND_SUBNETS}
      - FIREWALL_INPUT_PORTS=8080
      - TZ=${TZ}
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
    networks:
      - media

  qbittorrent:
    image: linuxserver/qbittorrent
    container_name: qbittorrent
    network_mode: service:gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ./qbittorrent:/config
      - /mnt/media:/data
    depends_on:
      - gluetun
    restart: unless-stopped

  prowlarr:
    image: linuxserver/prowlarr
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "9696:9696"
    volumes:
      - ./prowlarr:/config
    restart: unless-stopped
    networks:
      - media

  radarr:
    image: linuxserver/radarr
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "7878:7878"
    volumes:
      - ./radarr:/config
      - /mnt/media:/data
    restart: unless-stopped
    networks:
      - media

  sonarr:
    image: linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "8989:8989"
    volumes:
      - ./sonarr:/config
      - /mnt/media:/data
    restart: unless-stopped
    networks:
      - media

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    volumes:
      - ./seerr:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped
    networks:
      - media

  jellyfin:
    image: linuxserver/jellyfin
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "8096:8096"
    volumes:
      - ./jellyfin:/config
      - /mnt/media:/data
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    networks:
      - media

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
    volumes:
      - ./nginx/data:/data
      - ./nginx/letsencrypt:/etc/letsencrypt
    networks:
      - media

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      - TZ=${TZ}
      - FTLCONF_webserver_api_password=${PIHOLE_WEBPASSWORD:-}
      - FTLCONF_webserver_port=8888
      - PIHOLE_DNS_1=1.1.1.1
      - PIHOLE_DNS_2=8.8.8.8
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    restart: unless-stopped

  pihole-exporter:
    image: ekofr/pihole-exporter:latest
    container_name: pihole-exporter
    network_mode: host
    environment:
      - PIHOLE_HOSTNAME=localhost
      - PIHOLE_PORT=8888
      - PIHOLE_PASSWORD=${PIHOLE_WEBPASSWORD:-}
      - PORT=9617
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - "3000:3000"
    volumes:
      - ./homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/media:/mnt/media:ro
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS:-}
      - PUID=${PUID}
      - PGID=${PGID}
      - HOMEPAGE_VAR_JELLYFIN_KEY=${JELLYFIN_API_KEY}
      - HOMEPAGE_VAR_SEERR_KEY=${SEERR_API_KEY}
      - HOMEPAGE_VAR_RADARR_KEY=${RADARR_API_KEY}
      - HOMEPAGE_VAR_SONARR_KEY=${SONARR_API_KEY}
    restart: unless-stopped
    networks:
      - media

