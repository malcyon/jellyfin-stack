  freshrss:
    image: freshrss/freshrss:latest
    container_name: freshrss
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - CRON_MIN=4,34
    volumes:
      - ./freshrss/data:/var/www/FreshRSS/data
      - ./freshrss/extensions:/var/www/FreshRSS/extensions
    ports:
      - "8082:80"
    networks:
      - media

  romm:
    image: rommapp/romm:latest
    container_name: romm
    restart: unless-stopped
    environment:
      - DB_HOST=romm-db
      - DB_NAME=romm
      - DB_USER=romm-user
      - DB_PASSWD=${ROMM_DB_PASSWORD}
      - ROMM_AUTH_SECRET_KEY=${ROMM_AUTH_SECRET_KEY}
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID:-}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET:-}
      - MOBYGAMES_API_KEY=${MOBYGAMES_API_KEY:-}
      - SCREENSCRAPER_USER=${SCREENSCRAPER_USER:-}
      - SCREENSCRAPER_PASSWORD=${SCREENSCRAPER_PASSWORD:-}
      - RETROACHIEVEMENTS_API_KEY=${RETROACHIEVEMENTS_API_KEY:-}
      - STEAMGRIDDB_API_KEY=${STEAMGRIDDB_API_KEY:-}
      - HASHEOUS_API_ENABLED=true
      - LAUNCHBOX_API_ENABLED=true
      - FLASHPOINT_API_ENABLED=true
      - HLTB_API_ENABLED=false
    volumes:
      - ./romm/resources:/romm/resources
      - ./romm/redis-data:/redis-data
      - ./romm/assets:/romm/assets
      - ./romm/config:/romm/config
      - /mnt/media/roms:/romm/library/roms
      - /mnt/media/bios:/romm/library/bios
      - ./romm/saves:/romm/library/saves
      - ./romm/states:/romm/library/states
      - ./romm/screenshots:/romm/library/screenshots
    ports:
      - "8083:8080"
    depends_on:
      romm-db:
        condition: service_healthy
    networks:
      - media

  romm-db:
    # Pinned to major 12 (the version the data dir was created with).
    # MariaDB cannot downgrade across majors, so an unpinned :latest jumping
    # to 13 on a pull would break this DB with no clean rollback. Bump the
    # major deliberately (and back up ./romm/db first), never incidentally.
    image: mariadb:12
    container_name: romm-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${ROMM_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=romm
      - MYSQL_USER=romm-user
      - MYSQL_PASSWORD=${ROMM_DB_PASSWORD}
    volumes:
      - ./romm/db:/var/lib/mysql
    networks:
      - media
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "8085:8080"
    volumes:
      - ./sabnzbd:/config
      - /mnt/media:/data
    restart: unless-stopped
    networks:
      - media

  glance:
    image: glanceapp/glance
    container_name: glance
    restart: unless-stopped
    ports:
      - 8081:8080
    volumes:
      - ./glance/config:/app/config
      - ./glance/assets:/app/assets
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file: .env
    networks:
      - media


  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: "${PUID}:${PGID}"
    environment:
      - ND_LOGLEVEL=info
      - ND_SCANSCHEDULE=1h
      - ND_SESSIONTIMEOUT=24h
      - ND_TRANSCODINGCACHESIZE=100MB
      - ND_DEFAULTLANGUAGE=en
    ports:
      - "4533:4533"
    volumes:
      - ./navidrome:/data
      - /mnt/media/music:/music:ro
    restart: unless-stopped
    networks:
      - media

  beets:
    image: lscr.io/linuxserver/beets:latest
    container_name: beets
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./beets:/config
      - /mnt/media/music:/music
    restart: unless-stopped
    networks:
      - media

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: media-server
    network_mode: host
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ROUTES=192.168.1.0/24
      - TS_USERSPACE=false
      - TS_AUTH_ONCE=true
    volumes:
      - ./tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest
    container_name: kiwix
    restart: unless-stopped
    volumes:
      - ./kiwix/data:/data
    ports:
      - "8084:80"
    entrypoint: ["/bin/sh", "-c", "kiwix-serve /data/*.zim"]
    networks:
      - media

  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=002
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - ffmpegVersion=7
      - nodeName=InternalNode
    ports:
      - "8265:8265"
      - "8266:8266"
    volumes:
      - ./tdarr/server:/app/server
      - ./tdarr/configs:/app/configs
      - ./tdarr/logs:/app/logs
      - /mnt/media/tdarr-temp:/temp
      - /mnt/media:/media
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    networks:
      - media

networks:
  media:
    driver: bridge
