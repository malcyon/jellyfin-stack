# --- FreshRSS extensions ---

- name: Create FreshRSS extensions directory
  ansible.builtin.file:
    path: "{{ stack_path }}/freshrss/extensions"
    state: directory
    owner: "{{ stack_user }}"
    mode: "0755"

- name: Install af_readability FreshRSS extension
  ansible.builtin.unarchive:
    src: https://github.com/Niehztog/freshrss-af-readability/archive/refs/heads/master.zip
    dest: "{{ stack_path }}/freshrss/extensions"
    remote_src: true
    creates: "{{ stack_path }}/freshrss/extensions/af_readability"
  become_user: "{{ stack_user }}"
  notify: Restart freshrss

- name: Rename af_readability extension directory to expected name
  ansible.builtin.command:
    cmd: mv freshrss-af-readability-master freshrss/extensions/af_readability
    chdir: "{{ stack_path }}"
    creates: "{{ stack_path }}/freshrss/extensions/af_readability"
  become_user: "{{ stack_user }}"

# --- MOTD cleanup ---

- name: Disable noisy MOTD scripts
  ansible.builtin.file:
    path: "/etc/update-motd.d/{{ item }}"
    mode: "0644"
  loop:
    - 10-help-text
    - 50-motd-news
    - 91-contract-ua-esm-status
    - 91-release-upgrade

- name: Disable Ubuntu Pro apt-news (ESM marketing in MOTD)
  ansible.builtin.command:
    cmd: pro config set apt_news=false
  changed_when: false

# --- Host CLI tools ---

- name: Install pipx and ffmpeg for spotdl
  ansible.builtin.apt:
    name:
      - pipx
      - ffmpeg
    state: present
    update_cache: true

- name: Install spotdl via pipx
  ansible.builtin.command:
    cmd: pipx install spotdl
    creates: "/home/{{ stack_user }}/.local/bin/spotdl"
  become_user: "{{ stack_user }}"

- name: Install exiftool for photo date backfill
  ansible.builtin.apt:
    name: libimage-exiftool-perl
    state: present

# --- Start stack ---

- name: Start media stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ stack_path }}"
  changed_when: false
