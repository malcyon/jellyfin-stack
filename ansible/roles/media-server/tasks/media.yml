---
# --- Stack directory ---

- name: Ensure stack directory exists
  ansible.builtin.file:
    path: "{{ stack_path }}"
    state: directory
    owner: "{{ stack_user }}"
    mode: "0755"

- name: Remove .git directory (cleanup from previous git clone deployment)
  ansible.builtin.file:
    path: "{{ stack_path }}/.git"
    state: absent

# --- File deployment from Ansible controller ---

- name: Copy docker-compose.yml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker-compose.yml"
    dest: "{{ stack_path }}/docker-compose.yml"
    owner: "{{ stack_user }}"
    mode: "0644"

- name: Create homepage directory
  ansible.builtin.file:
    path: "{{ stack_path }}/homepage"
    state: directory
    owner: "{{ stack_user }}"
    mode: "0755"

- name: Copy homepage config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../homepage/"
    dest: "{{ stack_path }}/homepage/"
    owner: "{{ stack_user }}"
    mode: "0644"
    directory_mode: "0755"

- name: Create glance directory
  ansible.builtin.file:
    path: "{{ stack_path }}/glance"
    state: directory
    owner: "{{ stack_user }}"
    mode: "0755"

- name: Copy glance config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../glance/"
    dest: "{{ stack_path }}/glance/"
    owner: "{{ stack_user }}"
    mode: "0644"
    directory_mode: "0755"

- name: Create pihole/etc-dnsmasq.d directory
  ansible.builtin.file:
    path: "{{ stack_path }}/pihole/etc-dnsmasq.d"
    state: directory
    owner: "{{ stack_user }}"
    mode: "0755"

- name: Copy pihole local DNS reservations (initial setup only)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../pihole/etc-dnsmasq.d/02-local-reservations.conf"
    dest: "{{ stack_path }}/pihole/etc-dnsmasq.d/02-local-reservations.conf"
    owner: "{{ stack_user }}"
    mode: "0644"
    force: false

# --- Directory creation ---

- name: Create radarr config directory
  ansible.builtin.file:
    path: "{{ stack_path }}/radarr"
    state: directory
    owner: "{{ stack_user }}"
    group: media
    mode: "0755"

- name: Create sonarr config directory
  ansible.builtin.file:
    path: "{{ stack_path }}/sonarr"
    state: directory
    owner: "{{ stack_user }}"
    group: media
    mode: "0755"

- name: Create prowlarr config directory
  ansible.builtin.file:
    path: "{{ stack_path }}/prowlarr"
    state: directory
    owner: "{{ stack_user }}"
    group: media
    mode: "0755"

- name: Create sabnzbd config directory
  ansible.builtin.file:
    path: "{{ stack_path }}/sabnzbd"
    state: directory
    owner: "{{ stack_user }}"
    group: media
    mode: "0755"

- name: Create qbittorrent config directory
  ansible.builtin.file:
    path: "{{ stack_path }}/qbittorrent/qBittorrent"
    state: directory
    owner: "{{ stack_user }}"
    group: media
    mode: "0755"

- name: Copy qBittorrent categories (initial setup only)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../qbittorrent/qBittorrent/categories.json"
    dest: "{{ stack_path }}/qbittorrent/qBittorrent/categories.json"
    owner: "{{ stack_user }}"
    mode: "0644"
    force: false

- name: Create kiwix data directory
  ansible.builtin.file:
    path: "{{ stack_path }}/kiwix/data"
    state: directory
    owner: "{{ stack_user }}"
    mode: "0755"

- name: Create seerr config directory
  ansible.builtin.file:
    path: "{{ stack_path }}/seerr"
    state: directory
    owner: "{{ stack_user }}"
    group: media
    mode: "0755"

- name: Create bazarr config directory
  ansible.builtin.file:
    path: "{{ stack_path }}/bazarr/config"
    state: directory
    owner: "{{ stack_user }}"
    group: media
    mode: "0755"

# --- Template deployment ---

- name: Deploy .env from vault
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/env.j2"
    dest: "{{ stack_path }}/.env"
    owner: "{{ stack_user }}"
    mode: "0600"

- name: Deploy radarr config.xml from vault (initial setup only)
  ansible.builtin.copy:
    content: "{{ lookup('template', playbook_dir ~ '/templates/radarr-config.xml.j2') }}"
    dest: "{{ stack_path }}/radarr/config.xml"
    owner: "{{ stack_user }}"
    mode: "0644"
    force: false
  notify: Restart radarr

- name: Deploy sonarr config.xml from vault (initial setup only)
  ansible.builtin.copy:
    content: "{{ lookup('template', playbook_dir ~ '/templates/sonarr-config.xml.j2') }}"
    dest: "{{ stack_path }}/sonarr/config.xml"
    owner: "{{ stack_user }}"
    mode: "0644"
    force: false
  notify: Restart sonarr

- name: Deploy prowlarr config.xml from vault (initial setup only)
  ansible.builtin.copy:
    content: "{{ lookup('template', playbook_dir ~ '/templates/prowlarr-config.xml.j2') }}"
    dest: "{{ stack_path }}/prowlarr/config.xml"
    owner: "{{ stack_user }}"
    group: media
    mode: "0644"
    force: false
  notify: Restart prowlarr

- name: Deploy sabnzbd.ini from vault (initial setup only)
  ansible.builtin.copy:
    content: "{{ lookup('template', playbook_dir ~ '/templates/sabnzbd.ini.j2') }}"
    dest: "{{ stack_path }}/sabnzbd/sabnzbd.ini"
    owner: "{{ stack_user }}"
    mode: "0600"
    force: false
  notify: Restart sabnzbd

- name: Deploy qBittorrent.conf from vault (initial setup only)
  ansible.builtin.copy:
    content: "{{ lookup('template', playbook_dir ~ '/templates/qbittorrent.conf.j2') }}"
    dest: "{{ stack_path }}/qbittorrent/qBittorrent/qBittorrent.conf"
    owner: "{{ stack_user }}"
    mode: "0600"
    force: false
  notify: Restart qbittorrent

- name: Deploy seerr settings.json from vault (initial setup only)
  ansible.builtin.copy:
    content: "{{ lookup('template', playbook_dir ~ '/templates/seerr-settings.json.j2') }}"
    dest: "{{ stack_path }}/seerr/settings.json"
    owner: "{{ stack_user }}"
    mode: "0600"
    force: false
  notify: Restart seerr

- name: Deploy bazarr config.yaml from vault (initial setup only)
  ansible.builtin.copy:
    content: "{{ lookup('template', playbook_dir ~ '/templates/bazarr-config.yaml.j2') }}"
    dest: "{{ stack_path }}/bazarr/config/config.yaml"
    owner: "{{ stack_user }}"
    mode: "0600"
    force: false
  notify: Restart bazarr

# --- FreshRSS extensions ---

- name: Create FreshRSS extensions directory
  ansible.builtin.file:
    path: "{{ stack_path }}/freshrss/extensions"
    state: directory
    owner: "{{ stack_user }}"
    mode: "0755"

- name: Install af_readability FreshRSS extension
  ansible.builtin.unarchive:
    src: https://github.com/Niehztog/freshrss-af-readability/archive/refs/heads/master.zip
    dest: "{{ stack_path }}/freshrss/extensions"
    remote_src: true
    creates: "{{ stack_path }}/freshrss/extensions/af_readability"
  become_user: "{{ stack_user }}"
  notify: Restart freshrss

- name: Rename af_readability extension directory to expected name
  ansible.builtin.command:
    cmd: mv freshrss-af-readability-master freshrss/extensions/af_readability
    chdir: "{{ stack_path }}"
    creates: "{{ stack_path }}/freshrss/extensions/af_readability"
  become_user: "{{ stack_user }}"

# --- Start stack ---

- name: Start media stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ stack_path }}"
  changed_when: false
