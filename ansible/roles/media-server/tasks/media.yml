---
# --- Stack directory ---

- name: Ensure stack directory exists
  ansible.builtin.file:
    path: "{{ stack_path }}"
    state: directory
    owner: "{{ stack_user }}"
    mode: "0755"

- name: Remove .git directory (cleanup from previous git clone deployment)
  ansible.builtin.file:
    path: "{{ stack_path }}/.git"
    state: absent

# --- File deployment from Ansible controller ---

- name: Copy docker-compose.yml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker-compose.yml"
    dest: "{{ stack_path }}/docker-compose.yml"
    owner: "{{ stack_user }}"
    mode: "0644"

- name: Create homepage directory
  ansible.builtin.file:
    path: "{{ stack_path }}/homepage"
    state: directory
    owner: "{{ stack_user }}"
    mode: "0755"

- name: Copy homepage config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../homepage/"
    dest: "{{ stack_path }}/homepage/"
    owner: "{{ stack_user }}"
    mode: "0644"
    directory_mode: "0755"

- name: Create glance directory
  ansible.builtin.file:
    path: "{{ stack_path }}/glance"
    state: directory
    owner: "{{ stack_user }}"
    mode: "0755"

- name: Copy glance config
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../glance/"
    dest: "{{ stack_path }}/glance/"
    owner: "{{ stack_user }}"
    mode: "0644"
    directory_mode: "0755"

- name: Create pihole/etc-dnsmasq.d directory
  ansible.builtin.file:
    path: "{{ stack_path }}/pihole/etc-dnsmasq.d"
    state: directory
    owner: "{{ stack_user }}"
    mode: "0755"

- name: Copy pihole local DNS reservations (initial setup only)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../pihole/etc-dnsmasq.d/02-local-reservations.conf"
    dest: "{{ stack_path }}/pihole/etc-dnsmasq.d/02-local-reservations.conf"
    owner: "{{ stack_user }}"
    mode: "0644"
    force: false

# --- Directory creation ---

- name: Create radarr config directory
  ansible.builtin.file:
    path: "{{ stack_path }}/radarr"
    state: directory
    owner: "{{ stack_user }}"
    group: media
    mode: "0755"

- name: Create sonarr config directory
  ansible.builtin.file:
    path: "{{ stack_path }}/sonarr"
    state: directory
    owner: "{{ stack_user }}"
    group: media
    mode: "0755"

- name: Create lidarr config directory
  ansible.builtin.file:
    path: "{{ stack_path }}/lidarr"
    state: directory
    owner: "{{ stack_user }}"
    group: media
    mode: "0755"

- name: Create prowlarr config directory
  ansible.builtin.file:
    path: "{{ stack_path }}/prowlarr"
    state: directory
    owner: "{{ stack_user }}"
    group: media
    mode: "0755"

- name: Create sabnzbd config directory
  ansible.builtin.file:
    path: "{{ stack_path }}/sabnzbd"
    state: directory
    owner: "{{ stack_user }}"
    group: media
    mode: "0755"

- name: Create qbittorrent config directory
  ansible.builtin.file:
    path: "{{ stack_path }}/qbittorrent/qBittorrent"
    state: directory
    owner: "{{ stack_user }}"
    group: media
    mode: "0755"

- name: Copy qBittorrent categories (initial setup only)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../qbittorrent/qBittorrent/categories.json"
    dest: "{{ stack_path }}/qbittorrent/qBittorrent/categories.json"
    owner: "{{ stack_user }}"
    mode: "0644"
    force: false

- name: Create bios directory
  ansible.builtin.file:
    path: /mnt/media/bios
    state: directory
    owner: "{{ stack_user }}"
    mode: "0755"

- name: Create music directory
  ansible.builtin.file:
    path: /mnt/media/music
    state: directory
    owner: "{{ stack_user }}"
    group: media
    mode: "0775"

- name: Create navidrome config directory
  ansible.builtin.file:
    path: "{{ stack_path }}/navidrome"
    state: directory
    owner: "{{ stack_user }}"
    mode: "0755"

- name: Create beets config directory
  ansible.builtin.file:
    path: "{{ stack_path }}/beets"
    state: directory
    owner: "{{ stack_user }}"
    group: media
    mode: "0755"

- name: Copy beets config.yaml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../beets/config.yaml"
    dest: "{{ stack_path }}/beets/config.yaml"
    owner: "{{ stack_user }}"
    group: media
    mode: "0644"
  notify: Restart beets

- name: Create beets cron log file
  ansible.builtin.copy:
    content: ""
    dest: /var/log/beets-cron.log
    owner: "{{ stack_user }}"
    group: adm
    mode: "0644"
    force: false

- name: Schedule hourly Beets pass over the music library
  ansible.builtin.cron:
    name: "beets-import"
    minute: "30"
    hour: "*"
    job: "docker exec beets beet import -A -q /music/ >> /var/log/beets-cron.log 2>&1"
    user: "{{ stack_user }}"

- name: Install logrotate config for beets cron log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/beets-cron
    mode: "0644"
    content: |
      /var/log/beets-cron.log {
          weekly
          rotate 4
          compress
          missingok
          notifempty
          copytruncate
      }

- name: Create tailscale state directory
  ansible.builtin.file:
    path: "{{ stack_path }}/tailscale"
    state: directory
    owner: "{{ stack_user }}"
    mode: "0700"

- name: Enable IP forwarding for Tailscale subnet routing
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true

- name: Create kiwix data directory
  ansible.builtin.file:
    path: "{{ stack_path }}/kiwix/data"
    state: directory
    owner: "{{ stack_user }}"
    mode: "0755"

# --- Kiwix ZIM downloads (skipped if file already exists) ---

- name: Download Wikipedia English (with pictures)
  ansible.builtin.command:
    cmd: wget --continue --no-verbose -O wikipedia_en_all_maxi.zim
      https://download.kiwix.org/zim/wikipedia/wikipedia_en_all_maxi_2026-02.zim
    chdir: "{{ stack_path }}/kiwix/data"
    creates: "{{ stack_path }}/kiwix/data/wikipedia_en_all_maxi.zim"
  become_user: "{{ stack_user }}"

- name: Download Wikipedia Medicine
  ansible.builtin.command:
    cmd: wget --continue --no-verbose -O wikipedia_en_medicine_maxi.zim
      https://download.kiwix.org/zim/wikipedia/wikipedia_en_medicine_maxi_2026-04.zim
    chdir: "{{ stack_path }}/kiwix/data"
    creates: "{{ stack_path }}/kiwix/data/wikipedia_en_medicine_maxi.zim"
  become_user: "{{ stack_user }}"

- name: Download iFixit English
  ansible.builtin.command:
    cmd: wget --continue --no-verbose -O ifixit_en_all.zim
      https://download.kiwix.org/zim/ifixit/ifixit_en_all_2025-12.zim
    chdir: "{{ stack_path }}/kiwix/data"
    creates: "{{ stack_path }}/kiwix/data/ifixit_en_all.zim"
  become_user: "{{ stack_user }}"

- name: Download Wikibooks English
  ansible.builtin.command:
    cmd: wget --continue --no-verbose -O wikibooks_en_all.zim
      https://download.kiwix.org/zim/wikibooks/wikibooks_en_all_maxi_2026-04.zim
    chdir: "{{ stack_path }}/kiwix/data"
    creates: "{{ stack_path }}/kiwix/data/wikibooks_en_all.zim"
  become_user: "{{ stack_user }}"

- name: Create romm config directory
  ansible.builtin.file:
    path: "{{ stack_path }}/romm/config"
    state: directory
    owner: "{{ stack_user }}"
    mode: "0755"

- name: Deploy romm config.yml (initial setup only)
  ansible.builtin.copy:
    content: |
      exclude:
        platforms: []
        roms: []
    dest: "{{ stack_path }}/romm/config/config.yml"
    owner: "{{ stack_user }}"
    mode: "0644"
    force: false

- name: Create seerr config directory
  ansible.builtin.file:
    path: "{{ stack_path }}/seerr"
    state: directory
    owner: "{{ stack_user }}"
    group: media
    mode: "0755"

- name: Create bazarr config directory
  ansible.builtin.file:
    path: "{{ stack_path }}/bazarr/config"
    state: directory
    owner: "{{ stack_user }}"
    group: media
    mode: "0755"

- name: Create tdarr directories
  ansible.builtin.file:
    path: "{{ stack_path }}/tdarr/{{ item }}"
    state: directory
    owner: "{{ stack_user }}"
    group: media
    mode: "0755"
  loop:
    - server
    - configs
    - logs

- name: Create tdarr transcode temp directory on /mnt/media
  ansible.builtin.file:
    path: /mnt/media/tdarr-temp
    state: directory
    owner: "{{ stack_user }}"
    group: media
    mode: "0775"

# --- OneDrive sync ---

- name: Create OneDrive data directory on media drive
  ansible.builtin.file:
    path: /mnt/media/onedrive
    state: directory
    owner: "{{ stack_user }}"
    group: media
    mode: "0775"

- name: Create OneDrive config directory
  ansible.builtin.file:
    path: "{{ stack_path }}/onedrive/config"
    state: directory
    owner: "{{ stack_user }}"
    mode: "0700"

- name: Deploy OneDrive client config
  ansible.builtin.copy:
    content: |
      # sync_dir is the in-container path; the host bind mount points it at
      # /mnt/media/onedrive (see docker-compose.yml).
      sync_dir = "/onedrive/data"
    dest: "{{ stack_path }}/onedrive/config/config"
    owner: "{{ stack_user }}"
    mode: "0644"

- name: Deploy OneDrive sync_list (Pictures only for now)
  ansible.builtin.copy:
    # Leading slash anchors to the sync root, so this matches ONLY the top-level
    # /Pictures folder. An unanchored "Pictures/" also matches nested folders
    # named Pictures anywhere in the account (e.g. Documents/Ancestry/Pictures).
    content: |
      /Pictures/*
    dest: "{{ stack_path }}/onedrive/config/sync_list"
    owner: "{{ stack_user }}"
    mode: "0644"

- name: Seed OneDrive refresh token from vault (initial setup only)
  ansible.builtin.copy:
    # Stored base64-encoded in the vault so the opaque ~400-char token can't be
    # mangled by quoting/newlines on the way in. Decoded here to the exact bytes.
    content: "{{ vault_onedrive_refresh_token_b64 | b64decode }}"
    dest: "{{ stack_path }}/onedrive/config/refresh_token"
    owner: "{{ stack_user }}"
    mode: "0600"
    # force:false — the client rotates this token itself; never clobber it on
    # later runs or we'd revert to a stale token and break auth.
    force: false

