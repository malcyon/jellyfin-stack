---
- name: Create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Grafana GPG key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"

- name: Add Grafana apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    state: present
    filename: grafana

- name: Install Alloy
  ansible.builtin.apt:
    name: alloy
    state: present
    update_cache: true

- name: Add alloy user to docker group
  ansible.builtin.user:
    name: alloy
    groups: docker
    append: true
  notify: Restart alloy

- name: Add alloy user to systemd-journal group
  ansible.builtin.user:
    name: alloy
    groups: systemd-journal
    append: true
  notify: Restart alloy

- name: Deploy Alloy config
  ansible.builtin.template:
    src: alloy-config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: alloy
    group: alloy
    mode: "0640"
    backup: true
  notify: Restart alloy

- name: Create containerd systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/containerd.service.d
    state: directory
    mode: "0755"

- name: Configure containerd socket to be accessible by docker group
  ansible.builtin.copy:
    dest: /etc/systemd/system/containerd.service.d/docker-group-socket.conf
    content: |
      [Service]
      ExecStartPost=/bin/bash -c 'chgrp docker /run/containerd/containerd.sock && chmod g+rw /run/containerd/containerd.sock'
    mode: "0644"
  notify: Reload systemd daemon

- name: Apply containerd socket group permission immediately
  ansible.builtin.file:
    path: /run/containerd/containerd.sock
    group: docker
    mode: "0660"

- name: Enable and start Alloy
  ansible.builtin.systemd:
    name: alloy
    enabled: true
    state: started
